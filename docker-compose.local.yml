version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: home_local_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  agent:
    build:
      context: ./home-local-agent
      dockerfile: Dockerfile
    container_name: home_local_agent
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - HOST_MOUNT_DIR=/mnt/host
    ports:
      - "9000:9000"
    volumes:
      # Mount the user's home directory so the agent can read/organize files
      # Instructions will tell Windows users to run with:
      # docker-compose -f docker-compose.local.yml up -d
      - ${USERPROFILE:-~}:/mnt/host
    depends_on:
      - ollama

volumes:
  ollama_models:
