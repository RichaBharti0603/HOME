services:
  # 1. Backend API (FastAPI)
  - type: web
    name: home-backend
    env: python
    rootDir: home-cloud-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: home-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: home-frontend
          property: url
      - key: APP_ENV
        value: production
      - key: AI_SERVICE_URL
        value: "" # To be updated manually by user after Ngrok setup

  # 2. Celery Worker (Monitoring Engine)
  - type: worker
    name: home-worker
    env: python
    rootDir: home-cloud-backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: home-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString

  # 3. Static Frontend (React/Vite)
  - type: web
    name: home-frontend
    env: static
    rootDir: home-frontend/vite-project
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: home-backend
          property: url

# 4. Managed PostgreSQL
databases:
  - name: home-db
    plan: free

# 5. Managed Redis
redis:
  - name: home-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic
