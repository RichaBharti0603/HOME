services:
  # 1. Backend API
  - type: web
    name: home-backend
    env: python
    plan: free
    rootDir: home-cloud-backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: home-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: home-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://home-frontend-fjvl.onrender.com
      - key: CORS_ORIGINS
        value: https://home-frontend-fjvl.onrender.com,https://home-frontend.onrender.com,http://localhost:5173,http://localhost:3000
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AI_SERVICE_URL
        value: ""

  # 2. Worker
  - type: worker
    name: home-worker
    env: python
    plan: free
    rootDir: home-cloud-backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: home-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: home-redis
          property: connectionString

  # 3. Frontend
  - type: web
    name: home-frontend
    env: static
    plan: free
    rootDir: home-frontend/vite-project
    buildCommand: |
      npm ci --cache .npm-cache
      npm run build
    publishDir: ./dist
    healthCheckPath: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: "https://home-dpl4.onrender.com"

  # 4. Redis
  - type: redis
    name: home-redis
    plan: free
    ipAllowList: []

databases:
  - name: home-db
    plan: free
