services:
  # 1. Backend API (FastAPI)
  - type: web
    name: home-backend
    env: python
    plan: free
    rootDir: home-cloud-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: home-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AI_SERVICE_URL
        value: ""

  # 2. Celery Worker
  - type: worker
    name: home-worker
    env: python
    plan: free
    rootDir: home-cloud-backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: home-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: home-redis
          property: connectionString

  # 3. Frontend (React/Vite)
  - type: web
    name: home-frontend
    env: static
    plan: free
    rootDir: home-frontend/vite-project
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: home-backend
          property: url

databases:
  - name: home-db
    plan: free

services:
  - type: redis
    name: home-redis
    plan: free